<body>
<div class="wrap" id="app">
  <div class="top" id="topbar">
    <div class="brand"><img class="minilogo" src="logo.svg" alt="Smålands Gastransport"><div><h1 id="ttl">Transport Planering</h1><p id="sub">Laddar…</p></div></div>
    <div class="acts"><button class="btn small" id="refresh">Uppdatera</button><button class="btn small" id="switch" hidden>Byt bil</button></div>
  </div>
  <div id="main"></div>
  <p class="status" id="status"></p>
</div>
<div id="toastHost"></div>
<script>
/*GPSM*//* GPS-motor v1 – kontrollerar dagens godsdeklarationer mot GPS-stopp, summerar km/stopp.
   Indata (dag) = samma format som Arnes/Annelies milrapport (Mapon route/list normaliserad):
   {datum, forare, kmTotalt, rutter:[{bas,km,slap,start,slut,stopp:[{tid,plats,km,fraktsedel,typ,avvikelse}]}], vikt:{"HH:MM":{fore,efter,min}}}
   Fungerar i webbläsare (window.GPSM) och node (module.exports). */
(function(root){
"use strict";
const norm=v=>String(v||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const STOP=new Set(["ab","vagen","vag","smalandska","brantsle","depa","hemma","kort","stopp","rast","lunch","natt","parkering","vid","kontoret","fyllstation","och","i","mapon","anger"]);
const isNum=x=>typeof x==="number"&&isFinite(x);

/* "Flishult/Vetlanda (22m) – rast/lunch" -> {namn, radie, notis, art} */
function parsePlats(p){
  p=String(p||"");
  const m=p.match(/\((\d+)\s*m\)/);const radie=m?+m[1]:null;
  let notis="";const dash=p.split(/\s[–-]\s/);let namn=dash[0];if(dash.length>1)notis=dash.slice(1).join(" – ");
  namn=namn.replace(/\(\d+\s*m\)/g,"").replace(/\(natt\)/i,"").trim();
  const all=norm(p);
  let art="kund";
  if(/\(natt\)|natt/.test(p)&&/parkering|natt/.test(all))art="natt";
  if(/malilla depa|hagelsrum \(?hemma|hemma\)?$/.test(all)||/^hagelsrum|^malilla depa/.test(norm(namn)))art="bas";
  if(/fyllstation|orrvagen/.test(all)&&!/vimmerby/.test(all))art="fyll";
  if(/rast|lunch/.test(all))art="rast";
  if(/kort stopp/.test(all))art="kort";
  if(/kontor|hjalmar petris|torpvagen/.test(all))art="kontor";
  if(/parkering/.test(all)&&art==="kund")art="parkering";
  return {namn,radie,notis,art,nyckel:tokens(namn)};
}
function tokens(s){return norm(s).split(" ").filter(t=>t.length>2&&!STOP.has(t)&&!/^\d+$/.test(t));}
const refsOf=s=>String((s&&s.fraktsedel)||"").split(",").map(x=>x.trim()).filter(x=>x&&x!=="–");

/* Plattar ut rutter -> stopp med löpande ordning och km från föregående */
function flatten(day){
  const out=[];(day.rutter||[]).forEach((r,ri)=>{(r.stopp||[]).forEach((s,si)=>{const P=parsePlats(s.plats);
    out.push({rutt:ri,idx:si,slap:!!r.slap,tid:s.tid,km:isNum(s.km)?s.km:0,plats:s.plats,typ:s.typ||null,refs:refsOf(s),avvikelse:s.avvikelse||null,...P,
      sista:si===(r.stopp.length-1)});});});
  return out;
}
const toMin=t=>{const m=String(t||"").match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;};

/* Viktändring av bilens axeltryck (Mapon can_period, 4 axlar) per stopp. Regel från Jesper: fall >=8 t = "Last av",
   ökning >=8 t = "Last på", <2,5 t = ingen ändring, annars delvis. OBS: släp syns INTE i Mapon (bil+tomt flak ~14,7 t, fullt ~30-32 t),
   så släp måste avgöras ur stoppmönster (>=2 kundstopp på samma rutt) eller bekräftas av Jesper. */
function slapHandelser(day,tr){
  tr=tr||8000;const ev=[];
  for(const [t,v] of Object.entries(day.vikt||{})){
    if(!isNum(v.fore)||!isNum(v.efter))continue;const d=v.efter-v.fore;

function verifiera(day,decls,opt){

  const kunder=S.filter(s=>s.art==="kund"||s.refs.length);

  for(const d of decls){
    const nr=String(d.nr||"").trim();
    let hit=null,hur="";
    if(nr){hit=S.find(s=>s.refs.includes(nr));if(hit)hur="nummer";}
    if(!hit){const dt=declTokens(d);let bestS=0;for(const s of kunder){const sc=s.nyckel.filter(t=>dt.some(x=>x===t||x.startsWith(t)||t.startsWith(x))).length;
        if(sc>bestS){bestS=sc;hit=s;}}

    anv.add(hit);
    const p={niva:"ok",kod:"OK",nr,stopp:hit.plats,tid:hit.tid,hur,text:`Deklaration ${nr} stämmer mot GPS-stopp ${hit.tid} ${hit.namn}.`,decl:d};
    if(hur==="plats"&&nr&&hit.refs.length&&!hit.refs.includes(nr)){p.niva="varning";p.kod="ANNAT_NR";p.text=`Deklaration ${nr} verkar höra till stoppet ${hit.tid} ${hit.namn}, men det stoppet är registrerat med ${hit.refs.join(", ")}.`;}
    if(hur==="nummer"){const dt=declTokens(d);if(dt.length&&hit.nyckel.length&&!hit.nyckel.some(t=>dt.some(x=>x===t||x.startsWith(t)||t.startsWith(x)))){p.niva="varning";p.kod="ORT_STAMMER_INTE";p.text=`Nummer ${nr} finns på stoppet ${hit.tid} ${hit.namn}, men deklarationen anger ${d.ort||d.adress}. Kan vara fel ort eller fel nummer.`;}}
    res.poster.push(p);
  }
  for(const s of S){if((s.art==="kund")&&!s.refs.length&&!anv.has(s)&&!s.sista&&!(s.avvikelse&&/okänt/i.test(s.avvikelse)&&false)){
      res.poster.push({niva:"varning",kod:"STOPP_UTAN_DEKL",tid:s.tid,stopp:s.plats,text:`GPS-stopp ${s.tid} ${s.namn} har ingen deklaration.`});}}

  const per=new Map();for(const d of decls){const h=S.find(s=>s.refs.includes(String(d.nr||"").trim()));if(!h)continue;const k=h.tid+"|"+h.plats;if(!per.has(k))per.set(k,{L:0,R:0,h});const o=per.get(k);if(d.typ==="leverans")o.L+=d.antal||1;else if(d.typ==="retur_tom")o.R+=d.antal||1;}
  for(const o of per.values()){if(o.h.typ==="byte"&&o.L!==o.R)res.poster.push({niva:"varning",kod:"BYTE_OJAMNT",tid:o.h.tid,stopp:o.h.plats,text:`Stoppet ${o.h.tid} ${o.h.namn} är ett byte men deklarationerna är ${o.L} leverans/${o.R} retur.`});}
  const c=k=>res.poster.filter(p=>p.niva===k).length;
  res.sammanfattning={ok:c("ok"),varning:c("varning"),fel:c("fel"),deklarationer:decls.length,status:c("fel")?"fel":c("varning")?"granska":"stammer"};
  return res;
}

/* Summering för energideklaration: km, stopp, kundstopp, tomkörning, släpkm, rast, tomgång */
function summera(day){
  const S=flatten(day);const rutter=day.rutter||[];

  const m=new Map();for(const d of days)for(const s of flatten(d)){if(s.art!=="rast")continue;const k=s.namn;const o=m.get(k)||{namn:k,antal:0,min:0};o.antal++;o.min+=standtid(d,s.tid)||0;m.set(k,o);}

async function plMoveDay(from,to){
  const B=S.bundle,cars=(B.planCars||[]),jobs=[];
  if(!to||to===from)throw new Error("Välj ett annat datum.");
  for(const c of cars){const src=S.plans[c.dir+"|"+from];if(!src||!src.legs||!src.legs.length)continue;
    const dst=S.plans[c.dir+"|"+to];if(dst&&dst.legs&&dst.legs.length)throw new Error((c.name||c.id)+" har redan en utskickad rutt den "+dayLabel(to).toLowerCase()+". Ta tillbaka den först.");
    jobs.push([c,src])}
  if(!jobs.length)throw new Error("Det finns inga utskickade rutter att flytta den dagen.");
  const now=new Date().toISOString();
  for(const [c,src] of jobs){
    const moved=Object.assign({},src,{date:to,dDate:to,updated:now,legs:src.legs.map(l=>Object.assign({},l))});
    await ghPlanPut(c.dir,to,moved);
    const empty=Object.assign({},src,{legs:[],updated:now});
    await ghPlanPut(c.dir,from,empty);
    S.plans[c.dir+"|"+to]=moved;S.plans[c.dir+"|"+from]=empty;
    const bc=B.cars.find(x=>x.dir===c.dir);if(bc){delete bc.days[from];bc.days[to]=ovDay(moved)}
    for(const d of [from,to]){const k=c.dir+"|"+d;delete S.pl.drafts[k];store.set("pl:"+k,null)}
  }
  return jobs.length}
async function plSend(retract){

  try{await ghPlanPut(car.dir,S.pl.date,out);S.plans[planKeyOf()]=out;D.sent=retract?null:out.updated;D.dirty=false;D.baseUpd=out.updated;if(retract)D.legs=D.legs;store.set("pl:"+planKeyOf(),JSON.stringify(D));
    const c=S.bundle.cars.find(x=>x.dir===car.dir);if(c){if(retract)delete c.days[S.pl.date];else c.days[S.pl.date]=ovDay(out)}
    toast(retract?"Rutten är tillbakatagen.":"Utskickad till "+((D.driver||"").split(" ")[0]||"bilen")+".")}
  catch(e){toast("Kunde inte skicka. Kontrollera nätet och försök igen.")}
}

function legDiff(a,b){const out=[],A=new Map(a.map(x=>[x.o,x])),B=new Map(b.map(x=>[x.o,x]));
  const nm=x=>x.f+" → "+x.t+(x.m?" ("+x.m+")":"");
  b.forEach(x=>{const y=A.get(x.o);if(!y){out.push("Ny transport: "+nm(x)+(x.n?" – "+x.n:""));return}
    const c=[];if(y.f!==x.f||y.t!==x.t)c.push("sträcka "+y.f+" → "+y.t+" blir "+x.f+" → "+x.t);if(y.m!==x.m)c.push("mängd "+(y.m||"–")+" blir "+(x.m||"–"));if(y.a!==x.a)c.push("antal "+y.a+" blir "+x.a);if(y.l!==x.l)c.push("last "+y.l+" blir "+x.l);if(y.n!==x.n)c.push("kommentar ändrad"+(x.n?": "+x.n:""));
    if(c.length)out.push("Ändrad transport "+nm(x)+": "+c.join(", "))});
  a.forEach(y=>{if(!B.has(y.o))out.push("Borttagen: "+nm(y))});
  const oa=a.filter(y=>B.has(y.o)).map(y=>y.o).join(),ob=b.filter(y=>A.has(y.o)).map(y=>y.o).join();if(!out.length&&oa!==ob)out.push("Ordningen på transporterna är ändrad");
  return out}

function sumData(car){
  const B=S.bundle,H=B.hist||{dagar:[],bilar:{}},names=Object.fromEntries(CARS);
  const want=k=>car==="tot"||car===k;
  const n1=x=>(Math.round(x*10)/10).toLocaleString("sv-SE");
  const O={legs:0,done:0,kg:0,rep:0,fullN:0,trl:[],byFrom:{},byTo:{},perDag:[],hist:[]};
  const add=(o,k,kg,fl)=>{const x=o[k]||(o[k]={n:0,fl:0,kg:0});x.n++;x.fl+=fl;x.kg+=kg||0};
  B.cars.forEach(c=>{const ck=carKey(c.name);if(!want(ck))return;Object.keys(c.days).sort().forEach(d=>{if(!inR(d))return;
    const dd=c.days[d],st=statesFor(c.dir,d);
    const act=allLegs(c.dir,d,dd.legs.map(l=>Object.assign({},l,{from:{name:l.from},to:{name:l.to}}))).filter(l=>!l.deleted);
    let kg=0,done=0;
    act.forEach(l=>{const fl=l.antal||1;if(st.get(l.order+"|lossad"))done++;
      if(l.load==="full"){O.fullN++;if(l.kg!=null){kg+=l.kg;O.rep++}add(O.byTo,l.to.name,l.kg,fl);if(String(l.from.name).indexOf("Påfyllning")===0)add(O.byFrom,l.from.name,l.kg,fl)}});
    O.legs+=act.length;O.done+=done;O.kg+=kg;
    if(dd.trailer)O.trl.push([dayLabel(d),names[ck]||c.name,dd.trailer,String(act.length)]);
    O.perDag.push([d,names[ck]||c.name,(dd.driver||"").split(" ")[0],dd.trailer||"–",String(act.length),String(done),kg?sp(kg):"–"])})});
  O.hist=(H.dagar||[]).filter(d=>want(d.car)&&inR(d.datum));
  O.fs=(H.fs||[]).filter(x=>want(x.car)&&inR(x.datum));
  return O;
}
function rapportRows(car,O){

  return Object.values(R).sort((a,b)=>a.st<b.st?-1:a.st>b.st?1:a.car<b.car?-1:1).map(r=>({st:r.st,fordon:fv(r.car)+" ("+(names[r.car]||r.car)+")",bransle:br(r.car),fran:Object.keys(r.fran).join(", "),antal:r.n,m3:r.n*14,avst:r.kn?Math.round(r.km/r.kn*10)/10:null,retur:r.retK?Math.round(r.retKm/r.retK*10)/10:null}));

function histBlock(car,O){

    if(d.rutter&&d.rutter.length){m.r=true;d.rutter.forEach(r=>{m.rut++;m.kund+=r.kund||0;if(r.slap)m.slap++})}else if(d.slapDag)m.slap++});

    const rows=[];Object.keys(lev).sort().forEach(f=>{const tot=Object.values(lev[f]).reduce((a,b)=>a+b,0);rows.push(["<b>"+f+"</b> (totalt)",String(tot),String(tot*14)]);Object.keys(lev[f]).sort((a,b)=>lev[f][b]-lev[f][a]).forEach(t=>rows.push(["  → "+t,String(lev[f][t]),String(lev[f][t]*14)]))});

    return sec("Gas per hämtställe och mottagare (fulla flak, enligt deklarationer)",tbl(["Hämtat från → levererat till","Flak","m³ (14/flak)"],rows.map(r=>[r[0].replace(/<\/?b>/g,""),r[1],r[2]]))+'<p class="muted" style="margin:0;font-size:13.5px">Historiska deklarationer anger nominellt 14 m³ per flak. Exakt mängd i kg redovisas från och med att chaufförerna anger tryck vid Lastad.</p>')+sec("Tomma flak åter (returer)",tbl(["Från station → till","Flak"],rr))};
  return rapportBlock(car,O)+gasBlock()+(keys.length?sec("Kilometer",tbl(["Månad","Bil","Dagar","Km","Kundstopp","Km/stopp","Släp"],keys.map(k=>{const [ym,c]=k.split("|"),m=M[k];return [MN[+ym.slice(5)-1]+" "+ym.slice(0,4),names[c]||c,String(m.dagar),n1(m.km),m.r?String(m.kund):"–",m.r&&m.kund?n1(m.km/m.kund):"–",String(m.slap)]}),["Totalt","",String(tot.dagar),n1(tot.km),tot.r?String(tot.kund):"–",tot.r&&tot.kund?n1(tot.km/tot.kund):"–",String(tot.slap)]))
     :sec("Kilometer",'<p class="muted" style="margin:0">Ingen km-data för vald period.</p>'))+
    sec("Bil och bränsle",tbl(["Bil","Reg.nr","Bränsle","Släp"],fuel))+
    (perDag.length?sec("Körda dagar (milrapport)",tbl(["Datum","Bil","Förare","Km","Släp"],perDag)):"");
}

function milCount(d){/* stopp = fraktsedelrader (leverans 1 + retur 1) */let n=0;d.rutter.forEach(r=>r.stopp.forEach(s=>{if(s.fs)n+=String(s.fs).split(",").filter(x=>x.trim()&&x.trim()!=="–").length}));return n}
function milFlags(d){/* GPS-kontroll i appen: stopp utan deklaration, byten utan 2 sedlar */
  const F=[];d.rutter.forEach(r=>r.stopp.forEach((s,i)=>{const P=GPSM.parsePlats(s.plats),n=s.fs?String(s.fs).split(",").filter(x=>x.trim()).length:0;

  if(al.length)h+='<div class="notice msg" style="border-left:5px solid var(--accent);margin-bottom:10px"><b>Nytt från kontoret</b>'+foldList("al",al.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).map(a=>'<div style="margin-top:6px;font-size:16px">'+esc(a.t)+'</div>'))+'<div style="margin-top:10px"><button class="btn go" data-al="ok">Okej, jag har läst</button></div></div>';
  if("Notification" in window&&Notification.permission==="default")h+='<div class="notice" style="margin-bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>Få en avisering när rutten ändras eller kontoret svarar.</span><button class="btn small" data-al="perm">Slå på aviseringar</button></div>';
  return h}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-al]");if(!t)return;
  if(t.dataset.al==="chg"){store.set(t.dataset.k,t.dataset.u);render();return}
  if(t.dataset.al==="ok"){const s=alSeen();topAlerts().forEach(a=>s.add(a.key));store.set(seenKey(),JSON.stringify([...s].slice(-300)));render();return}
  if(t.dataset.al==="perm"){try{await Notification.requestPermission()}catch(x){}ensurePush();render()}});
function notifyDriver(title,body,tag){
  try{toast(title+(body?": "+body:""))}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  try{if("Notification" in window&&Notification.permission==="granted"){
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,tag:tag||"rutt",icon:"icon-192.png",badge:"icon-192.png",vibrate:[200,100,200],renotify:true})).catch(()=>{try{new Notification(title,{body})}catch(x){}});
    else new Notification(title,{body})}}catch(e){}}
S.nf2={route:null,al:null,sig:""};
async function driverPoll(){
  if(document.visibilityState!=="visible"||!S.bundle||S.bundle.role!=="driver"||S.pollBusy||S.busy)return;S.pollBusy=true;
  try{await afterLoad();
    const dir=S.bundle.dir,ru={};Object.keys(S.plans).forEach(k=>{if(k.indexOf(dir+"|")===0)ru[k]=S.plans[k].updated});
    const al=new Set(topAlerts().map(a=>a.key));
    if(S.nf2.route){
      const ch=Object.keys(ru).filter(k=>S.nf2.route[k]!==ru[k]);
      if(ch.length)notifyDriver("Rutten är uppdaterad","Kontoret har ändrat dagens rutt.","rutt-"+ch[0]);
      else{const nw=topAlerts().filter(a=>!S.nf2.al.has(a.key)&&!a.seen);if(nw.length)notifyDriver("Nytt från kontoret",nw[0].t,"al-"+nw[0].key)}}
    S.nf2.route=ru;S.nf2.al=al;
    const sig=JSON.stringify([ru,[...al],Object.keys(S.server).map(k=>k+":"+(S.server[k]||[]).length),S.hm.length,S.fel.length]);
    if(sig!==S.nf2.sig){S.nf2.sig=sig;render()}}
  catch(e){}
  finally{S.pollBusy=false}}
setInterval(driverPoll,60*1000);
S.shownDay=today();setInterval(()=>{const t=today();if(S.shownDay!==t){S.shownDay=t;if(S.bundle){try{pickDate()}catch(e){}render();if(S.sess)refresh(true)}}},15*1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(driverPoll,300)});

setInterval(()=>{if(document.visibilityState==="visible"&&S.sess)refresh()},5*60*1000);
setInterval(async()=>{if(document.visibilityState!=="visible"||!S.bundle)return;if(isOv()){await afterLoad();if(S.fresh){S.fresh=false;render()}}else if(pendingCount()){await sync();render()}},60*1000);
window.addEventListener("online",async()=>{if(S.bundle&&S.bundle.role==="driver"){await sync();render()}});
/* ---------- Arkivappen: sparar körda godsdeklarationer som PDF i en mapp på datorn ---------- */
S.ak={dir:null,perm:"",files:[],msg:"",busy:false,todo:0};
const AKDB=()=>new Promise((ok,no)=>{const q=indexedDB.open("arkiv",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
async function akKv(k,v){const db=await AKDB();return new Promise((ok,no)=>{const t=db.transaction("kv",v===undefined?"readonly":"readwrite"),o=t.objectStore("kv"),q=v===undefined?o.get(k):o.put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
const akClean=x=>String(x||"").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim();
async function akPerm(ask){const h=S.ak.dir;if(!h)return false;const o={mode:"readwrite"};let p=await h.queryPermission(o);if(p!=="granted"&&ask)p=await h.requestPermission(o);S.ak.perm=p;return p==="granted"}
async function akInit(){if(S.ak.init)return;S.ak.init=true;if(!window.showDirectoryPicker)return;try{S.ak.dir=await akKv("dir")||null}catch(e){}
  if(S.ak.dir){await akPerm(false);if(S.ak.perm==="granted")await akScanDisk()}}
function akItems(){const out=[],t=today();
  (S.bundle.planCars||[]).forEach(pc=>{if(!pc.dir)return;
    Object.keys(S.plans).forEach(k=>{if(k.indexOf(pc.dir+"|")!==0)return;const d=k.slice(pc.dir.length+1);if(d>t||isTest(d))return;
      const p=S.plans[k];if(!p||!p.legs||!p.legs.length)return;const r=planToRoute(p),st=statesFor(pc.dir,d);
      allLegs(pc.dir,d,r.legs).forEach(l=>{if(l.deleted||!st.get(l.order+"|lossad"))return;
        out.push({dir:pc.dir,date:d,car:akClean((pc.name||"Bil")+" "+(p.driver||pc.driver||"")),leg:l,r,ok:kordGet(pc.dir,d,l.order),name:akClean(l.order)+".pdf"})})})});
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
async function akLoad(){
  if(!S.bundle||S.bundle.role!=="admin"){S.ak.msg="Arkivet kräver inloggning som kontoret.";return}
  await akInit();await loadPlansAdmin();
  const t=today();
  for(const pc of (S.bundle.planCars||[])){if(!pc.dir)continue;
    for(const k of Object.keys(S.plans)){if(k.indexOf(pc.dir+"|")!==0)continue;const d=k.slice(pc.dir.length+1);if(d>t||store.get("akdone:"+k))continue;
      if(!S.plans[k]||!S.plans[k].legs||!S.plans[k].legs.length)continue;
      await ghList(pc.dir,d);await fetchNy(pc.dir,d)}}
  if(S.ak.dir&&S.ak.perm==="granted")await akSync(false);else S.ak.todo=akItems().length}
async function akWalk(root){const out=[];
  async function go(h,path){for await(const [n,x] of h.entries()){if(x.kind==="directory")await go(x,path.concat(n));else if(/\.pdf$/i.test(n))out.push({path,name:n,h:x})}}
  await go(root,[]);return out}
async function akScanDisk(){try{S.ak.files=await akWalk(S.ak.dir)}catch(e){S.ak.files=[]}}
async function akSync(ask){
  if(S.ak.busy)return;if(!await akPerm(ask)){S.ak.todo=akItems().length;return}
  S.ak.busy=true;let n=0,fail=0;
  try{for(const it of akItems()){
      try{let d=S.ak.dir;for(const part of [it.date.slice(0,4),it.date.slice(0,7),it.date,it.car])d=await d.getDirectoryHandle(part,{create:true});
        let ex=false;try{await d.getFileHandle(it.name);ex=true}catch(e){}
        if(ex)continue;
        const blob=await makePdf([it.leg],it.r),fh=await d.getFileHandle(it.name,{create:true}),w=await fh.createWritable();await w.write(blob);await w.close();n++}
      catch(e){fail++}}
    // markera dagar där allt är sparat så att de inte hämtas om
    const items=akItems(),by={};items.forEach(i=>(by[i.dir+"|"+i.date]=by[i.dir+"|"+i.date]||[]).push(i));
    if(!fail)Object.keys(by).forEach(k=>{const d=k.split("|")[1];if(d<today()){const pl=S.plans[k];const all=pl.legs.length;if(by[k].length>=all)store.set("akdone:"+k,"1")}});
    await akScanDisk();S.ak.todo=0;S.ak.msg=n?n+" nya deklarationer sparade.":(fail?fail+" kunde inte sparas.":"Allt är redan sparat.");S.ak.last=Date.now()}
  finally{S.ak.busy=false}}
function akHtml(){
  if(!S.bundle)return '<div class="card muted">'+(S.err?esc(S.err):'Hämtar…')+'</div>';
  if(S.bundle.role!=="admin")return '<div class="card">Arkivet är för kontoret. Logga ut och in med kontorets inloggning.</div>';
  const A=S.ak,can=!!window.showDirectoryPicker;
  let h='<div class="content" style="max-width:980px;margin:0 auto">';
  if(!can)return h+'<div class="card"><b>Den här webbläsaren kan inte spara till en vald mapp.</b><p class="muted">Öppna arkivet i Chrome eller Edge på datorn. Då sparas varje PDF direkt på hårddisken.</p></div></div>';
  h+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between"><div><b>Sparmapp på datorn</b><div class="muted" style="font-size:14px">'+(A.dir?esc(A.dir.name)+(A.perm==="granted"?" · ansluten":" · behöver ditt godkännande"):"Ingen vald än")+'</div></div><div class="acts">'+
    '<button class="btn" data-ak="pick">'+(A.dir?"Byt mapp":"Välj mapp")+'</button>'+
    (A.dir?'<button class="btn primary" data-ak="sync"'+(A.busy?' disabled':'')+'>'+(A.perm==="granted"?(A.busy?"Sparar…":"Spara nya nu"):"Ge åtkomst och spara")+'</button>':'')+'</div></div>'+
    (A.msg?'<div class="notice">'+esc(A.msg)+'</div>':'')+
    (A.dir&&A.perm!=="granted"?'<div class="notice warn">Webbläsaren frågar om lov igen varje gång appen startas. Tryck på <b>Ge åtkomst och spara</b>.</div>':'')+
    (A.dir&&A.perm==="granted"&&A.todo?'<div class="notice warn">'+A.todo+' deklarationer väntar på att sparas.</div>':'')+
    '<p class="muted" style="margin:0;font-size:13.5px">Allt sparas bara i mappen på den här datorn, aldrig i något moln. Varje transport som är markerad Lossad sparas som en PDF i mappen <i>år / månad / datum / bil och förare</i>. Redan sparade filer skrivs aldrig över.</p></div>';
  if(!A.dir)return h+'</div>';
  if(A.perm!=="granted")return h+'</div>';
  const fs=A.files.slice().sort((a,b)=>(b.path.join("/")+b.name).localeCompare(a.path.join("/")+a.name));
  h+='<div style="margin:14px 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Sparade deklarationer <span class="muted" style="font-size:15px">('+fs.length+' st)</span></h2><input id="akq" placeholder="Sök på datum, bil, förare, order…" style="flex:1;min-width:220px;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg)"></div>';
  if(!fs.length)return h+'<div class="card muted">Inga sparade PDF:er än.</div></div>';
  let last="";
  fs.forEach((f,i)=>{const day=f.path[2]||f.path.join("/");
    if(day!==last){last=day;h+='<div class="akday muted" data-akday style="margin:14px 0 4px;font-weight:600">'+esc(day)+'</div>'}
    h+='<button class="card akrow" data-ak="open" data-i="'+A.files.indexOf(f)+'" data-q="'+esc((f.path.join(" ")+" "+f.name).toLowerCase())+'" style="display:flex;width:100%;text-align:left;gap:12px;align-items:center;justify-content:space-between;margin:0 0 6px;padding:11px 14px;cursor:pointer"><span><b>'+esc(f.name.replace(/\.pdf$/i,""))+'</b> <span class="muted">· '+esc(f.path[3]||"")+'</span></span><span class="muted">Öppna ›</span></button>'});
  return h+'</div>'}
function akClose(){const o=document.getElementById("akview");if(o){const f=o.querySelector("iframe");if(f)URL.revokeObjectURL(f.dataset.u);o.remove()}}
document.addEventListener("click",async e=>{
  if(!window.ARKIV)return;const t=e.target.closest("[data-ak]");if(!t)return;const a=t.dataset.ak;
  if(a==="pick"){try{const h=await showDirectoryPicker({mode:"readwrite",id:"gods-arkiv"});S.ak.dir=h;await akKv("dir",h);await akPerm(true);await akScanDisk();S.ak.msg="";await akSync(false)}catch(err){if(err&&err.name!=="AbortError")S.ak.msg="Kunde inte välja mappen."}render();return}
  if(a==="sync"){S.ak.msg="";render();await akSync(true);render();return}
  if(a==="open"){const f=S.ak.files[+t.dataset.i];if(!f)return;
    try{const file=await f.h.getFile(),u=URL.createObjectURL(new Blob([await file.arrayBuffer()],{type:"application/pdf"}));akClose();
      const o=document.createElement("div");o.id="akview";o.style.cssText="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;flex-direction:column;padding:16px;gap:8px";
      o.innerHTML='<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;color:#fff"><b>'+esc(f.name)+'</b><button class="btn" data-ak="close" style="color:#111">Stäng</button></div><iframe data-u="'+u+'" src="'+u+'" style="flex:1;border:0;background:#fff;border-radius:4px"></iframe>';
      document.body.appendChild(o)}catch(err){S.ak.msg="Kunde inte öppna filen.";render()}return}
  if(a==="close")akClose()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")akClose()});
document.addEventListener("input",e=>{if(e.target.id!=="akq")return;const q=e.target.value.trim().toLowerCase();document.querySelectorAll(".akrow").forEach(b=>b.hidden=!!q&&b.dataset.q.indexOf(q)<0)});

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
refresh();
})();
</script>
