<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transport Planering</title>
<meta name="theme-color" content="#133a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Transport Planering">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#c9ccd0;--surface:#fbfbfb;--sunk:#e4e6e8;--line:#b5babf;--fg:#1f1e1d;--muted:#6b6a64;
  --accent:#1f5a44;--accent-fg:#fff;--accent-soft:#d8e6df;--blue:#1f5fa8;--blue-soft:#e1ebf7;--brand:#00aa13;--adr:#d7261e;
  --full:#1d7a4a;--full-bg:#e1f2e8;--empty:#6b5a2a;--empty-bg:#f6eed6;--warn:#9a5b00;--warn-bg:#fdf0d6;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1d1f;--surface:#26292c;--sunk:#303438;--line:#3c4146;--fg:#eceeef;--muted:#a3a9ae;
  --accent:#2f7d5e;--accent-fg:#fff;--accent-soft:#1d352b;--blue:#6aa5ec;--blue-soft:#1a2c42;--brand:#3fc163;--adr:#e2463e;
  --full:#6cc48f;--full-bg:#16301f;--empty:#e0c47a;--empty-bg:#33290f;--warn:#e6a64a;--warn-bg:#3a2c12;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.1;letter-spacing:-.01em}
button,a.btn{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.diamond{width:42px;height:42px;position:relative;flex:none}
.diamond::before{content:"";position:absolute;inset:6px;background:var(--adr);transform:rotate(45deg);border-radius:3px}
.diamond span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.brand p{margin:0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:10px 16px;min-height:48px;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{min-height:38px;padding:6px 12px;font-size:14.5px}
.btn:disabled{opacity:.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.muted{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 14px;font-weight:600;min-height:40px;cursor:pointer}
.chip[aria-current="date"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip span{font-weight:400;opacity:.8}
.stats{display:flex;gap:10px 26px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:700}
.reg{font-weight:700;letter-spacing:.06em;border:1.5px solid var(--fg);border-radius:4px;padding:0 6px;font-size:14px}
.legs{display:flex;flex-direction:column;gap:12px}
.leg{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:10px}
.legtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.n{font-family:var(--f-display);font-size:24px;font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:5px;white-space:nowrap}
.p-full{background:var(--full-bg);color:var(--full)}
.p-tom{background:var(--empty-bg);color:var(--empty)}
.p-del{background:var(--blue-soft);color:var(--blue)}
.p-type{background:var(--sunk);color:var(--fg)}
.p-antal{background:var(--blue-soft);color:var(--blue);border:1.5px solid var(--blue);font-size:14.5px;font-weight:800}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start}
.route .arrow{font-size:22px;color:var(--muted);padding-top:14px}
.route .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.route b{display:block;font-size:17px}
.route span{display:block;font-size:15px;color:var(--muted)}
@media (max-width:520px){.route{grid-template-columns:minmax(0,1fr)}.route .arrow{display:none}}
.note{font-size:14.5px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.notice{padding:10px 14px;border-radius:5px;background:var(--accent-soft);font-size:15px}
.notice.warn{background:var(--warn-bg)}
.status{font-size:13.5px;color:var(--muted)}
.login{min-height:calc(100vh - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:24px}
.login .logo{width:min(440px,82vw);height:auto}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.login h2{text-align:center;font-size:24px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--muted)}
.login input{font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg)}
.login input:focus{outline:2px solid var(--accent);outline-offset:1px}
.minilogo{height:64px;width:auto}
.top{padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.brand{gap:18px}.brand p{font-size:15px}
.chip{min-height:44px;padding:8px 18px;font-size:16px}
html.wide .wrap{max-width:1360px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));gap:18px}
html.wide h2{font-size:28px}
html.wide .card{padding:24px}
html.wide .stat .v{font-size:32px}
html.wide .legs{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:16px}
html.wide .ov-car{padding:24px}
html.wide table{font-size:16px}
html.wide #main{display:flex;flex-direction:column;gap:18px}
@media (min-width:1100px){html.wide .minilogo{height:76px}}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;font:inherit;font-weight:600;font-size:16px;padding:12px 14px;border-radius:5px;cursor:pointer;color:var(--fg)}
.side button:hover{background:var(--sunk)}
.side button[aria-current=page]{background:var(--accent);color:var(--accent-fg)}
.badge{font-style:normal;font-size:12px;font-weight:800;min-width:22px;text-align:center;padding:2px 7px;border-radius:4px;background:var(--adr);color:#fff}
.content{display:flex;flex-direction:column;gap:18px;min-width:0}
.pagehead h2{font-size:30px}.pagehead p{margin:4px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1}
.tile .v small{font-size:15px;font-weight:500;color:var(--muted)}
.tile.hot{border-color:var(--warn);background:var(--warn-bg)}
.nrow{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.notis h3{margin-bottom:6px}
.notice.msg{background:var(--blue-soft);color:var(--fg);border-left:4px solid var(--blue)}
.p-warn{background:var(--warn-bg);color:var(--warn)}

.cargrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1250px){.cargrid{grid-template-columns:1fr}}
.cargrid .ov-row{grid-template-columns:auto minmax(0,1fr)}.cargrid .ov-row .ov-st{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.cargrid .ov-car{margin:0}
.side{background:#133a2e;border-color:#133a2e;padding:14px 10px;gap:4px;box-shadow:0 6px 18px rgba(19,58,46,.25)}
.side button{color:#d6ecdb;font-weight:500;padding:12px 14px}
.side button:hover{background:rgba(255,255,255,.09)}
.side button[aria-current=page]{background:#fff;color:#133a2e;font-weight:700}
.side .badge{background:#e5483d;color:#fff}
.side .sidehd{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8fc09b;padding:6px 14px 8px}
.pagehead{padding-bottom:4px;border-bottom:1px solid #aeb3b8;margin-bottom:2px}
.card{box-shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06)}
.tile{box-shadow:0 1px 2px rgba(60,50,20,.06)}
.pagehead h2{font-size:34px}
.pagehead{border-bottom-color:#cfc9ba}
.bar{height:8px;border-radius:4px}
.carcards{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.carcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;border-left:4px solid var(--line)}
.carcard[data-pcar]:hover{border-color:var(--accent);background:var(--accent-soft)}
.carcard.on{cursor:default;border-color:var(--accent);border-left-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.carcard .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:18px}
.carcard .cs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.carcard .cf{display:flex;flex-direction:column;gap:8px}
.fld{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.chip{border-radius:5px;font-weight:700}
.side{border-radius:6px}.side button{border-radius:4px}
.plcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.plcol{display:flex;flex-direction:column;gap:12px;min-width:0}
html.wide .plcol .legs{display:flex;flex-direction:column;gap:10px;grid-template-columns:none}
.plcol .leg{padding:14px;min-width:0;max-width:100%;box-sizing:border-box}.plcol .legtop{flex-wrap:wrap;gap:8px}.plcol .pills{flex-wrap:wrap;justify-content:flex-start}.plcol .card,.plcol .legs{min-width:0;max-width:100%}.plcol .acts{flex-wrap:wrap}
.plcol .carcard{cursor:default;border-top:4px solid var(--accent);border-left:1px solid var(--line)}
@media (max-width:1250px){.plcols{grid-template-columns:1fr}}
.sttable{padding:0;overflow-x:auto}
.strow{display:grid;grid-template-columns:minmax(230px,2.3fr) 140px 80px minmax(110px,1fr) minmax(110px,1fr) minmax(110px,1fr) minmax(110px,1fr) 80px;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);font-size:13.5px}
@media (max-width:1500px){.strow{min-width:1150px}}
.strow.sthead{border-top:0;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--sunk);position:sticky;top:0}
.strow[data-stedit]{cursor:pointer}.strow[data-stedit]:hover{background:var(--sunk)}
.strow .r{text-align:right}
.stn{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.stname{font-size:15.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.pills2{display:flex;gap:6px;flex-wrap:wrap}
.bp{font-style:normal;display:inline-flex;gap:5px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:13px;color:var(--muted)}.bp b{color:var(--fg)}
.bp u,.sts u{width:9px;height:9px;border-radius:50%;display:inline-block;text-decoration:none;background:#999}
.red u{background:#d6453d}.yel u{background:#e5a526}.grn u{background:#2da44e}.gry u{background:#8d8b84}
.sts{display:flex;gap:8px;align-items:center;font-size:14.5px}

/* Bred, tätare kontorsvy */
html.wide .wrap{max-width:none;padding-left:18px;padding-right:22px;gap:12px}
html.wide body{font-size:14px}
html.wide h1{font-size:26px}
html.wide h2{font-size:22px}html.wide .pagehead h2{font-size:26px}html.wide h3{font-size:17px}
html.wide .minilogo{height:56px}
html.wide .shell{grid-template-columns:190px minmax(0,1fr);gap:20px}
html.wide .side button{font-size:14px;padding:9px 12px}
html.wide .btn{font-size:14px;min-height:36px;padding:6px 12px}
html.wide .btn.big{min-height:44px;font-size:15px}
html.wide .chip{font-size:14px;min-height:32px;padding:3px 12px}
html.wide .card{padding:16px}
html.wide .tile{padding:12px 16px}html.wide .tile .v{font-size:26px}html.wide .tile .k{font-size:11px}
html.wide input,html.wide select,html.wide textarea{font-size:14px!important;padding:6px 9px!important}
html.wide .fld,html.wide label.muted{font-size:12.5px!important}
html.wide .leg{padding:12px}html.wide .n{font-size:19px}html.wide .note{font-size:14px}
html.wide .ov-row{font-size:13.5px}
html.wide .strow{font-size:13.5px;padding:10px 14px}
html.wide .carcard .ch{font-size:16px}
html.wide .notice{font-size:13.5px}
html.wide .pill,html.wide .tag{font-size:12px}
html.wide .nrow{font-size:14px}
html.wide table{font-size:14px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;flex-direction:row;overflow-x:auto}.side button{white-space:nowrap}}
html.out,html.out body{background:var(--surface)}
.btn.big{min-height:58px;font-size:18px;width:100%}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.link{border:0;background:none;min-height:38px;padding:4px 8px;color:var(--muted);text-decoration:underline;font-weight:500;font-size:14px}
.done{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:6px 12px;border-radius:5px;background:var(--full-bg);color:var(--full)}
.done.wait{background:var(--warn-bg);color:var(--warn)}
.leg.klar{border-color:var(--full)}
.ov-car{display:flex;flex-direction:column;gap:10px}
.ov-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ov-row .r{min-width:0;overflow-wrap:anywhere}
.ov-st{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:13px;font-weight:700;padding:2px 9px;border-radius:5px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.tag.on{background:var(--full-bg);color:var(--full)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:5px;font-size:15px;z-index:30;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top" id="topbar">
    <div class="brand"><img class="minilogo" src="logo.svg" alt="Smålands Gastransport"><div><h1>Transport Planering</h1><p id="sub">Laddar…</p></div></div>
    <div class="acts"><button class="btn small" id="refresh">Uppdatera</button><button class="btn small" id="switch" hidden>Byt bil</button></div>
  </div>
  <div id="main"></div>
  <p class="status" id="status"></p>
</div>
<div id="toastHost"></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS=["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"],MON=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const LOADS={full:"Fullt",tom:"Tomt",del:"Delvis"};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const S={cars:null,sess:null,key:null,bundle:null,date:null,offline:false,busy:false,pick:null,err:""};
try{S.sess=JSON.parse(store.get("sess")||"null")}catch(e){}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const today=()=>iso(new Date());
function dayLabel(s){const d=new Date(s+"T12:00:00");return DAYS[d.getDay()].replace(/^./,c=>c.toUpperCase())+" "+d.getDate()+" "+MON[d.getMonth()]}
function hhmm(s){if(!s)return "";const d=new Date(s);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function toast(m){const h=$("#toastHost");h.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML="",3500)}
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function deriveKey(pw,car){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:hex(car.salt),iterations:car.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"])}
async function open(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12))}
async function fetchBin(url){
  let r=null;try{r=await fetch(url+"?t="+Date.now(),{cache:"no-store"})}catch(e){}
  if((!r||!r.ok)&&"caches" in window)r=await caches.match(new URL(url,location.href).pathname);
  if(!r||!r.ok)throw new Error("nät");return r.arrayBuffer();
}
async function loadCars(){
  try{const r=await fetch("data/bilar.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;S.cars=await r.json();S.offline=false;store.set("bilar",JSON.stringify(S.cars))}
  catch(e){S.offline=true;try{S.cars=JSON.parse(store.get("bilar")||"null")}catch(x){}}
}
function carOf(u){return S.cars&&S.cars.cars.find(c=>c.u===u)}
async function userHash(n){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("rutt:"+n.trim().toLowerCase()));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
async function loadBundle(){
  const car=carOf(S.sess.u);if(!car)throw new Error("bil");
  if(!S.key)S.key=await deriveKey(S.sess.pw,car);
  let buf=null;
  try{buf=await fetchBin("data/"+car.dir+"/rutt.bin");store.set("rutt:"+car.dir,b64(buf))}
  catch(e){const c=store.get("rutt:"+car.dir);if(!c)throw e;buf=unb64(c).buffer;S.offline=true}
  const json=JSON.parse(new TextDecoder().decode(await open(S.key,buf)));
  const prev=S.bundle;S.bundle=json;pickDate();

  const take=(car,order)=>{S.pl.car=car.id;const D=plDraft(),i=D.legs.findIndex(l=>l.order===order);if(i<0)return null;return D.legs.splice(i,1)[0]};

function sumData(car){
  const B=S.bundle,H=B.hist||{dagar:[],bilar:{}},names=Object.fromEntries(CARS);
  const want=k=>car==="tot"||car===k;
  const n1=x=>(Math.round(x*10)/10).toLocaleString("sv-SE");
  const O={legs:0,done:0,kg:0,rep:0,fullN:0,trl:[],byFrom:{},byTo:{},perDag:[],hist:[]};
  const add=(o,k,kg,fl)=>{const x=o[k]||(o[k]={n:0,fl:0,kg:0});x.n++;x.fl+=fl;x.kg+=kg||0};
  B.cars.forEach(c=>{const ck=carKey(c.name);if(!want(ck))return;Object.keys(c.days).sort().forEach(d=>{if(!inR(d))return;
    const dd=c.days[d],st=statesFor(c.dir,d);
    const act=allLegs(c.dir,d,dd.legs.map(l=>Object.assign({},l,{from:{name:l.from},to:{name:l.to}}))).filter(l=>!l.deleted);
    let kg=0,done=0;

      if(l.load==="full"){O.fullN++;if(l.kg!=null){kg+=l.kg;O.rep++}add(O.byTo,l.to.name,l.kg,fl);if(String(l.from.name).indexOf("Påfyllning")===0)add(O.byFrom,l.from.name,l.kg,fl)}});
    O.legs+=act.length;O.done+=done;O.kg+=kg;
    if(dd.trailer)O.trl.push([dayLabel(d),names[ck]||c.name,dd.trailer,String(act.length)]);
    O.perDag.push([d,names[ck]||c.name,(dd.driver||"").split(" ")[0],dd.trailer||"–",String(act.length),String(done),kg?sp(kg):"–"])})});
  O.hist=(H.dagar||[]).filter(d=>want(d.car)&&inR(d.datum));

  return O;
}
function rapportRows(car,O){

  if(t.dataset.del){S.confirmDel=null;await record("raderad",t.dataset.del);toast("Transporten är raderad.");return}
  if(t.dataset.savenew){const r=route();const l=allLegs(S.bundle.dir,r.date,r.legs).find(x=>x.order===t.dataset.savenew);if(l){t.disabled=true;try{await shareBlob(await makePdf([l],r),l.order+".pdf")}catch(err){toast("Kunde inte skapa PDF:en.")}t.disabled=false}return}
  if(t.dataset.saveall){const r=route();const ls=allLegs(S.bundle.dir,r.date,r.legs).filter(l=>!l.deleted);t.disabled=true;try{await shareBlob(await makePdf(ls,r),r.allPdfName)}catch(err){toast("Kunde inte skapa PDF:en.")}t.disabled=false;return}
  if(t.dataset.undo){await record("angra-"+t.dataset.undo,t.dataset.order);toast("Ångrat.");return}
  if(t.dataset.save){t.disabled=true;await savePdf(t.dataset.save,t.dataset.name);t.disabled=false;return}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.pf&&S.bundle&&S.bundle.role==="admin"){const D=plDraft();D[t.dataset.pf]=t.value;plSaveDraft();return}if(t.dataset&&t.dataset.lfp!==undefined){readLast();const p=document.querySelector('[data-lfprev="'+t.dataset.lfp+'"]');if(p)p.textContent=prevTxt(S.lastForm,+t.dataset.lfp)}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="pDate"&&t.value){S.pl.date=t.value;S.pl.form=null;render();return}if(t.id==="rFrom"||t.id==="rTo"){S[t.id==="rFrom"?"from":"to"]=t.value;render();return}if(t.dataset&&t.dataset.lfn!==undefined&&S.lastForm){readLast();const i=+t.dataset.lfn,p=document.querySelector('[data-lfinfo="'+i+'"]');if(p)p.innerHTML=infoTxt(S.lastForm,i);const q=document.querySelector('[data-lfprev="'+i+'"]');if(q)q.textContent=prevTxt(S.lastForm,i)}});
document.addEventListener("submit",e=>{if(e.target.id==="loginForm"){e.preventDefault();const u=$("#user").value.trim(),pw=$("#pw").value.trim();if(!u||!pw){S.err="Fyll i användarnamn och lösenord.";render();return}login(u,pw)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.sess)refresh()});
setInterval(()=>{if(document.visibilityState==="visible"&&S.sess)refresh()},5*60*1000);
setInterval(async()=>{if(document.visibilityState!=="visible"||!S.bundle)return;if(isOv()){await afterLoad();render()}else if(pendingCount()){await sync();render()}},60*1000);
window.addEventListener("online",async()=>{if(S.bundle&&S.bundle.role==="driver"){await sync();render()}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
refresh();
})();
</script>
</body>
</html>
